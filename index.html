<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Intravest Co., Ltd. — investment and international material supply. Ferritic stainless coil and pipe and GBFS slag from the mills of Korea and Japan.">
<title>Intravest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300;62..125,500;62..125,700;62..125,800;62..125,900&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
/* Y series: Steelmaker (Z3) x Molten (Z7). Shared site chrome and inner pages first, then themes, then per-direction home pages. */
:root{--sans:"IBM Plex Sans","IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif;--disp:"Archivo","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--serif:"Newsreader",Georgia,serif;--gut:clamp(16px,5vw,80px)}
*{box-sizing:border-box}
body{margin:0;background:#0A0908;font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root[lang="ja"] body{line-height:1.9}
a{color:inherit;text-decoration:none} :focus-visible{outline:2px solid var(--ac);outline-offset:3px}
#app{min-height:100vh;background:var(--bg);color:var(--fg);position:relative}
#app.fade main{animation:fade .6s ease both} @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{margin:0;color:var(--fg)}
section{padding:clamp(64px,9vw,128px) var(--gut);position:relative}
.th-dark{--bg:#0A0908;--fg:#F3EEE8;--dim:#A39A90;--line:#2A2522;--ac:#F08A3C;--soft:#141110;color-scheme:dark}
.th-light{--bg:#FFFFFF;--fg:#0B1220;--dim:#626B78;--line:#E3E6EB;--ac:#1E4FA0;--soft:#F4F6F9;color-scheme:light}
.th-paper{--bg:#F2EDE4;--fg:#14110E;--dim:#6E655B;--line:#D8CFC2;--ac:#C2492B;--soft:#E9E2D6;color-scheme:light}
.y4,.y10{--ac:#C2492B}
/* header + menu */
.hd{position:absolute;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;gap:28px;padding:22px var(--gut);color:#fff}
.inner .hd,.y3 .hd,.y4.home .hd,.y7 .hd,.y8 .hd,.y10 .hd{position:relative;color:var(--fg)}
.y10 .hd{z-index:20}
.hd .mk{font:700 14px/1 var(--disp);letter-spacing:.36em}
.hd nav{margin-left:auto;display:flex;gap:26px;font-size:14px;padding-right:120px} .hd nav a{opacity:.82} .hd nav a:hover,.hd nav a[aria-current]{opacity:1;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.bgr{display:none;width:42px;height:42px;border:0;background:none;color:inherit;cursor:pointer;margin-left:auto;margin-right:110px;place-content:center;gap:7px} .bgr i{display:block;width:24px;height:1.5px;background:currentColor}
.hd.cine nav{display:none} .hd.cine .bgr{display:grid}
@media (max-width:900px){.hd nav{display:none}.bgr{display:grid}}
.ov{position:fixed;inset:0;z-index:40;background:#0A0908;color:#F3EEE8;padding:110px var(--gut) 40px;display:flex;flex-direction:column;justify-content:space-between}
.ov[hidden]{display:none} .ovin{display:grid;gap:6px} .ovin a{font:300 clamp(36px,6vw,84px)/1.15 var(--disp);font-stretch:70%;display:flex;gap:20px;align-items:baseline} .ovin a span{font:500 13px var(--mono);color:#F08A3C}
.ov p{color:#A39A90;margin:0}
/* shared atoms */
.ms{font:500 12px var(--sans);letter-spacing:.26em;margin:0 0 24px;opacity:.85}
.lb{font:600 12px var(--sans);letter-spacing:.22em;color:var(--ac);margin:0 0 40px;text-transform:uppercase}
.no{font:500 12px var(--mono);letter-spacing:.08em;color:var(--ac)}
.ld{max-width:36em;margin:26px 0 0;color:var(--dim);font-size:clamp(16px,1.3vw,19px)}
.more{display:inline-flex;gap:10px;margin-top:36px;font:600 14px var(--sans);border-bottom:1px solid currentColor;padding-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:999px;font:600 14px var(--sans);padding:14px 24px;cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.fxc{position:absolute;inset:0;width:100%;height:100%;display:block}
.in{position:relative}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)} .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}#app.fade main{animation:none}}
/* hero */
.hero{color:#fff;overflow:hidden} .hero.full{min-height:100svh;display:flex;align-items:flex-end;padding-bottom:10vh}
.hero h1{color:inherit;font:800 clamp(52px,9vw,150px)/.9 var(--disp);font-stretch:62%;text-transform:uppercase;letter-spacing:-.005em;max-width:12ch}
.hero h1 em{display:block;font:300 clamp(20px,2vw,30px)/1.4 var(--sans);text-transform:none;font-style:normal;margin-top:28px;max-width:none;letter-spacing:0}
:root[lang="ja"] .hero h1{font:700 clamp(36px,6vw,92px)/1.2 var(--sans)}
.hero .ld{color:rgba(255,255,255,.8)}
/* business cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(420px,44vw,600px);border-radius:24px;padding:clamp(28px,3.4vw,48px);color:#fff;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;transition:transform 1s cubic-bezier(.2,.7,.2,1)} .card:hover::before{transform:scale(1.05)}
.card.investment::before{background:radial-gradient(120% 90% at 85% 10%,#3D6FC9 0,transparent 55%),linear-gradient(160deg,#16326A,#0B1530)}
.card.supply::before{background:radial-gradient(110% 80% at 80% 15%,#F08A3C 0,transparent 50%),linear-gradient(160deg,#7A1E0E,#100605)}
.card .no{color:rgba(255,255,255,.75)} .card h3{color:#fff;font:800 clamp(40px,5vw,76px)/.92 var(--disp);font-stretch:62%;text-transform:uppercase;margin:12px 0 16px}
:root[lang="ja"] .card h3{font:700 clamp(30px,3.4vw,48px)/1.2 var(--sans)}
.card p{margin:0;max-width:30em;color:rgba(255,255,255,.85)} .card ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px} .card li{font-size:13px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 13px}
.go{margin-top:24px;font:600 14px var(--sans)}
@media (max-width:860px){.cards{grid-template-columns:1fr}}
/* figures, edges, products, steps */
.band{background:var(--soft)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.fig{border-left:2px solid var(--ac);padding-left:20px} .fig i{display:block;font:normal 600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.fig b{display:block;font:800 clamp(34px,3.6vw,54px)/1 var(--disp);font-stretch:62%;text-transform:uppercase} .fig span{display:block;color:var(--dim);font-size:14px;margin-top:10px}
:root[lang="ja"] .fig b{font:700 clamp(24px,2.4vw,34px)/1.2 var(--sans)}
@media (max-width:860px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.edges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--fg)} .edge{padding:30px 28px 10px 0}
.edge h4{font:700 clamp(26px,2.4vw,36px)/1.1 var(--sans);letter-spacing:-.02em;margin:12px 0 10px} .edge p{color:var(--dim);margin:0}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.prod{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:28px;min-height:260px;display:flex;flex-direction:column;transition:transform .4s,border-color .4s}
.prod:hover{transform:translateY(-4px);border-color:var(--ac)} .prod h4{font:700 clamp(22px,2vw,28px)/1.15 var(--sans);letter-spacing:-.02em;margin:14px 0 8px} .prod p{color:var(--dim);margin:0 0 18px;font-size:14px}
.prod .go{position:absolute;right:24px;top:20px;margin:0;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto} .chips span{font:500 13px var(--sans);border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:var(--bg)}
.chips.big span{font-size:17px;padding:8px 16px}
@media (max-width:860px){.edges,.prods{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.steps li{border-top:2px solid var(--line);padding:22px 20px 0 0;position:relative} .steps li::before{content:"";position:absolute;left:0;top:-2px;width:36px;height:2px;background:var(--ac)}
.steps h4{font:700 18px/1.3 var(--sans);margin:10px 0 8px} .steps p{color:var(--dim);font-size:14px;margin:0}
@media (max-width:980px){.steps{grid-template-columns:1fr 1fr;gap:28px}} @media (max-width:560px){.steps{grid-template-columns:1fr}}
/* contact band */
.cta{padding-top:0} .ctab{position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:clamp(36px,6vw,88px)}
.ctab h2{color:#fff;font:800 clamp(40px,6vw,96px)/.92 var(--disp);font-stretch:62%;text-transform:uppercase;max-width:12ch} :root[lang="ja"] .ctab h2{font:700 clamp(28px,4vw,54px)/1.3 var(--sans)}
.ctab .row{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;margin-top:36px} .ctab .more{margin:0}
.mail{display:inline-flex;align-items:center;gap:14px;border-bottom:1px solid currentColor;padding:6px 0;max-width:100%}
.mail code{font:500 clamp(16px,1.6vw,20px) var(--sans);user-select:all;white-space:nowrap} .mail .cp{background:none;border:0;color:inherit;opacity:.75;font:600 12px var(--sans);letter-spacing:.1em;cursor:pointer}
/* footer */
.fo{padding:56px var(--gut) 100px;background:#0A0908;color:#A39A90;font-size:13px}
.th-light .fo{background:#11161E;color:#9AA3AF} .fot{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid #2A2D33}
.fo .mk{font:700 14px var(--disp);letter-spacing:.36em;color:#fff} .fo nav{display:flex;flex-wrap:wrap;gap:10px 28px;color:#E3E6EB}
.fob{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 32px;padding-top:22px}
/* inner pages */
.sh{min-height:min(62svh,600px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;padding-bottom:clamp(40px,6vw,80px)}
.sh h1{color:#fff;font:800 clamp(44px,7.4vw,120px)/.92 var(--disp);font-stretch:62%;text-transform:uppercase;max-width:14ch} :root[lang="ja"] .sh h1{font:700 clamp(32px,4.8vw,68px)/1.25 var(--sans)}
.crumb{font-size:13px;opacity:.75;margin:0 0 28px} .crumb a{text-decoration:underline;text-underline-offset:4px}
.lead2 p{font:400 clamp(22px,2.6vw,36px)/1.45 var(--sans);letter-spacing:-.01em;max-width:28em;margin:0}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px} .item{background:var(--soft);border-radius:20px;padding:32px}
.item h3{font:700 clamp(24px,2.2vw,32px)/1.15 var(--sans);letter-spacing:-.02em;margin:16px 0 10px} .item p{color:var(--dim);margin:0}
.note{margin:40px 0 0;padding-left:16px;border-left:2px solid var(--ac);color:var(--dim)}
@media (max-width:860px){.items{grid-template-columns:1fr}}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px} .docs li{border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:15px}
.nx{padding-top:0} .nx a{display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);padding:32px 0}
.nx span{color:var(--dim);font-size:13px;letter-spacing:.2em;text-transform:uppercase} .nx b{font:800 clamp(32px,5vw,72px)/1 var(--disp);font-stretch:62%;text-transform:uppercase} :root[lang="ja"] .nx b{font:700 clamp(24px,3vw,40px) var(--sans)}
.pd{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px)} .pd h4{font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 16px}
.pd .tag{font:400 clamp(22px,2.2vw,30px)/1.35 var(--sans);margin:0 0 36px} .pdr .btn{margin-top:32px}
table{color:inherit;font:inherit}
.spec{width:100%;border-collapse:collapse;margin-bottom:36px} .spec th{text-align:left;width:34%;font:500 14px var(--sans);color:var(--dim);padding:16px 0;border-bottom:1px solid var(--line);vertical-align:top} .spec td{padding:16px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.spec.wide th{width:220px}
.uses{list-style:none;margin:0;padding:0} .uses li{padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
@media (max-width:860px){.pd{grid-template-columns:1fr}}
.ctp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px)} .lead3{font:400 clamp(19px,1.8vw,24px)/1.5 var(--sans);margin:0 0 36px} .addr p{color:var(--dim);margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px} .form label{display:grid;gap:8px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)} .form .w{grid-column:1/-1}
.form input,.form select,.form textarea{font:400 16px var(--sans);color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-transform:none;letter-spacing:0}
.form .btn{grid-column:1/-1;justify-self:start}
@media (max-width:860px){.ctp,.form{grid-template-columns:1fr}}

/* ---- per-direction home pages ---- */
/* 2 blue to fire */
.duo .fire{opacity:0} .duo h1{position:relative;min-height:1.9em} .duo h1 span{position:absolute;left:0;bottom:0;transition:opacity .2s} .duo .w2{opacity:0}
/* 3 furnace split */
.split2{display:flex;min-height:100svh;padding:0}
.half{position:relative;flex:1;display:flex;align-items:flex-end;color:#fff;overflow:hidden;padding:0 clamp(24px,4vw,64px) 10vh;transition:flex 1s cubic-bezier(.2,.7,.2,1)}
.half:hover{flex:1.6} .half h2{color:#fff;font:800 clamp(48px,7vw,120px)/.9 var(--disp);font-stretch:62%;text-transform:uppercase;margin:12px 0 16px} .half p{margin:0;opacity:.85} .half .no{color:#fff}
:root[lang="ja"] .half h2{font:700 clamp(32px,4.4vw,64px)/1.2 var(--sans)}
.y3 .hd{position:absolute;color:#fff} .intro2 h1{font:800 clamp(44px,6vw,96px)/.92 var(--disp);font-stretch:62%;text-transform:uppercase;max-width:14ch} .intro2 h1 em{display:block;font:400 clamp(20px,2vw,28px)/1.4 var(--sans);text-transform:none;font-style:normal;margin-top:20px;color:var(--dim)}
:root[lang="ja"] .intro2 h1{font:700 clamp(30px,4vw,56px)/1.3 var(--sans)}
@media (max-width:760px){.split2{flex-direction:column}.half{min-height:60svh}}
/* 4 giant heat */
.giant{color:var(--fg);padding-top:clamp(40px,6vw,80px)} .giant .ms{color:var(--ac)}
.heat{font:900 clamp(64px,13vw,230px)/.85 var(--disp)!important;font-stretch:62%!important;max-width:none!important;background:linear-gradient(100deg,#14110E 0%,#7A1E0E 30%,#F08A3C 45%,#14110E 60%,#14110E 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:heat 9s ease-in-out infinite alternate}
:root[lang="ja"] .heat{font:700 clamp(40px,8vw,120px)/1.15 var(--sans)!important}
@keyframes heat{from{background-position:100% 0}to{background-position:0 0}}
.giant .row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;align-items:end} .giant .sub{font:500 clamp(22px,2.4vw,34px)/1.3 var(--sans);margin:0} .giant .ld{color:var(--dim);margin:0}
@media (max-width:760px){.giant .row{grid-template-columns:1fr}}
/* 5 night mill */
.snap>*{min-height:100svh;display:flex;align-items:flex-end;padding:0 var(--gut) 12vh;color:#fff;overflow:hidden;position:relative}
.snap .in h2{color:#fff;font:800 clamp(64px,11vw,190px)/.88 var(--disp);font-stretch:62%;text-transform:uppercase;margin:14px 0 22px} .snap .in p{max-width:36em;color:rgba(255,255,255,.85);margin:0}
:root[lang="ja"] .snap .in h2{font:700 clamp(40px,6vw,90px)/1.2 var(--sans)}
:root[data-y="5"]{scroll-snap-type:y proximity} .snap>*{scroll-snap-align:start}
/* 6 rolling slab */
.slab::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(0,0,0,.35) 46px 48px);mix-blend-mode:multiply;animation:roll 14s linear infinite;pointer-events:none}
@keyframes roll{to{background-position:0 480px}}
.bigfigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px} .bf{border-top:1px solid var(--line);padding:28px 0}
.bf b{display:block;font:900 clamp(72px,11vw,190px)/.85 var(--disp);font-stretch:62%;color:transparent;-webkit-text-stroke:1.5px var(--ac);text-transform:uppercase} .bf span{color:var(--dim)}
:root[lang="ja"] .bf b{font:700 clamp(40px,5vw,72px)/1.2 var(--sans)}
@media (max-width:760px){.bigfigs{grid-template-columns:1fr}}
/* 7 corporate inset */
.inset{padding-top:8px} .box{position:relative;border-radius:32px;overflow:hidden;min-height:min(80svh,760px);display:flex;align-items:flex-end;color:#fff;padding:clamp(28px,5vw,72px)}
.box h1{color:#fff;font:700 clamp(40px,5.6vw,88px)/1.05 var(--sans);letter-spacing:-.035em;max-width:16ch} .box h1 em{font-style:normal;opacity:.75}
:root[lang="ja"] .box h1{font-size:clamp(30px,4vw,58px);line-height:1.35} .box .ld{color:rgba(255,255,255,.85)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px} .box .btn{background:#fff;color:#0B1220} .box .btn.ghost{background:transparent;color:#fff}
/* 8 editorial heat */
.ed{color:var(--fg);padding-top:clamp(32px,5vw,64px)} .ed .ms{color:var(--ac)}
.ed h1{font:900 clamp(60px,12vw,210px)/.85 var(--disp);font-stretch:62%;text-transform:uppercase;max-width:none;border-bottom:2px solid var(--fg);padding-bottom:24px}
:root[lang="ja"] .ed h1{font:700 clamp(40px,7vw,110px)/1.15 var(--sans)}
.ed .cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;margin-top:32px} .win{position:relative;aspect-ratio:16/10;overflow:hidden}
.ed .sub{font:400 clamp(26px,2.6vw,40px)/1.2 var(--serif);font-style:italic;margin:0} .ed .ld{color:var(--dim)}
@media (max-width:760px){.ed .cols{grid-template-columns:1fr}}
/* 9 cinematic */
.cine{align-items:center!important;text-align:center;justify-content:center} .cine .in{width:100%} .cine h1{margin:0 auto;max-width:14ch} .cine .sub{font:300 clamp(18px,1.8vw,26px) var(--sans);margin:28px 0 0}
.manifesto p{font:300 clamp(28px,3.6vw,56px)/1.3 var(--sans);letter-spacing:-.02em;max-width:22em;margin:0 auto;text-align:center}
/* 10 ember line */
.ember{position:relative;height:6px} .quiet{color:var(--fg);padding-top:clamp(56px,10vw,140px)} .quiet .ms{color:var(--ac)}
.quiet h1{font:800 clamp(48px,8vw,128px)/.9 var(--disp);font-stretch:62%;text-transform:uppercase;max-width:14ch} .quiet h1 em{color:var(--dim)} .quiet .ld{color:var(--dim)}
.y10 .card.investment::before,.y10 .card.supply::before{filter:saturate(.85)}
/* switcher */
.sw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:3px;padding:5px;background:rgba(14,14,14,.9);border-radius:999px;max-width:calc(100% - 24px);overflow-x:auto;backdrop-filter:blur(8px)}
.sw button{font:500 12px var(--sans);color:#BBB;background:none;border:0;border-radius:999px;padding:8px 11px;cursor:pointer;white-space:nowrap} .sw button[aria-pressed="true"]{background:#F2F2F2;color:#111}
.lg{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:12px;z-index:60;display:flex;background:rgba(14,14,14,.82);border-radius:999px;padding:3px}
.lg button{font:500 11.5px var(--sans);color:#BBB;background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer} .lg button[aria-pressed="true"]{background:#F2F2F2;color:#111}
</style>
