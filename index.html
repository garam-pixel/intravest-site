/* ---- V series: CI wordmark, floating header, symbols, motion ---- */
.th-light{--ac:#0B2A4A} .th-dark{--ac:#F08A3C} .th-paper{--ac:#C2492B}
:root{--navy:#0B2A4A;--navy2:#5E7391;--ci:"Public Sans","IBM Plex Sans",system-ui,sans-serif}

.wm .f.fire{color:transparent;background:linear-gradient(100deg,#7A1E0E,#F08A3C 35%,#C2492B 55%,#F6B26B 75%,#7A1E0E);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:heat 8s ease-in-out infinite alternate}

.wm.big{font-size:clamp(56px,13.6vw,236px);letter-spacing:.01em} .wm.sm{font-size:22px}
.lock{display:flex;align-items:center;gap:16px} .lock .rule{width:2px;height:40px;background:currentColor;opacity:.9} .tg2{display:flex;flex-direction:column;gap:2px;font:600 13px/1.3 var(--ci);color:inherit} .tg2 span{font-weight:400;opacity:.65;font-size:12px}

.flo .mk{display:flex;align-items:center;font-size:34px;transition:font-size .4s} .flo nav{margin-left:auto;display:flex;gap:24px;font:500 13.5px var(--sans);padding-right:116px} .flo nav a{opacity:.85} .flo nav a:hover,.flo nav a[aria-current]{opacity:1;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.home .th-dark .flo,.v1.home .flo,.v2.home .flo,.v4.home .flo,.v5.home .flo,.v6.home .flo,.v9.home .flo,.v3.home .flo .tile{color:#fff}
.v1.home .flo,.v2.home .flo,.v4.home .flo,.v5.home .flo,.v6.home .flo,.v9.home .flo,.inner .sh~.flo{--lg:#fff;color:#fff}
.scrolled .flo{top:10px;padding:8px 18px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.18),inset 0 0 0 1px color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg);--lg:var(--fg)}
.scrolled .flo .mk{font-size:24px}
.inner .flo{--lg:#fff;color:#fff} .scrolled.inner .flo{--lg:var(--fg)} .inner .scrolled .flo{--lg:var(--fg)}
.bgr{margin-right:104px} @media (max-width:900px){.flo{padding:10px 16px}.flo nav{display:none}.flo .mk{font-size:22px}}
.fo .mk{display:block;font:inherit;letter-spacing:0;color:#fff} .fo .lock{color:#fff} .fo .wm{--lg:#fff;color:#fff}
/* taglines */
h1.tg,.hero h1.tg{font:800 clamp(40px,7vw,116px)/.98 var(--ci);letter-spacing:-.03em;max-width:12ch;color:inherit;text-transform:none} h1.tg.giant{font-size:clamp(48px,9.6vw,160px);max-width:11ch} .hero h1.tg.mast{font-size:clamp(56px,11vw,190px);max-width:none;border-bottom:2px solid var(--fg);padding-bottom:24px}
:root[lang="ja"] h1.tg{font:700 clamp(30px,5.4vw,84px)/1.25 var(--sans);letter-spacing:-.01em;max-width:14ch} :root[lang="ja"] h1.tg.giant{font-size:clamp(34px,6.6vw,104px)}
.wd{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em} .wd i{display:inline-block;font-style:normal;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:inherit} .rv.in .wd i,[data-words].in .wd i{transform:none}
[data-words].rv{transform:none}
.hero .ld,.ld{max-width:34em} .hero .in .ms{color:rgba(255,255,255,.75)}

.card{transform-style:preserve-3d} .card h3,.card p{transition:transform .4s ease-out;will-change:transform}
